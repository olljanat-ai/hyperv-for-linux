name: Build Hyper-V package

# Repackages the closed-source Microsoft Hypervisor bits from the Azure
# Linux 3.0 non-oss repository into a single 'hyperv' .deb targeting
# Ubuntu 26.04. The .deb contains:
#   * the hypervisor loader and its private payload (under /usr/lib/hyperv/)
#   * firmware blobs needed at boot (under /usr/lib/firmware/hyperv/)
#   * a postinst hook that installs hvloader.efi onto the ESP and registers
#     a systemd-boot entry that chainloads it.
#
# Run weekly so newly published Microsoft drops get picked up.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-packages.yml"
      - "packaging/hyperv/**"
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

concurrency:
  # Serialise all writers to the apt repo (gh-pages) so two simultaneous
  # publishes don't clobber each other.
  group: apt-repo-publish
  cancel-in-progress: false

env:
  MS_REPO_BASE_URL: "https://packages.microsoft.com/azurelinux/3.0/prod"
  # RPMs we want to repackage. If Microsoft renames or splits them this list
  # is the single point of change.
  MS_RPMS: "mshv-bootloader-lx mshv"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts dpkg-dev fakeroot \
            rpm rpm2cpio cpio gnupg2 curl wget xz-utils \
            ca-certificates jq python3

      - name: Resolve latest HvLoader RPM URL
        run: |
          set -euo pipefail
          # The base feed exposes a simple directory listing. Scrape it
          # for the newest RPM matching each package name.
          HVLOADER_URL=${MS_REPO_BASE_URL}/base/x86_64/Packages/h
          INDEX="$(curl -fsSL "${HVLOADER_URL}/")"
          mkdir -p downloads
          pkg="hvloader"
          CANDIDATES="$(printf '%s\n' "$INDEX" \
            | grep -oE "${pkg}-[0-9][^\"']*\.rpm" \
            | sort -uV)"
          if [ -z "$CANDIDATES" ]; then
            echo "::error::No RPMs found for '${pkg}' at ${HVLOADER_URL}/"
            exit 1
          fi
          RPM="$(printf '%s\n' "$CANDIDATES" | tail -n1)"
          echo "Latest ${pkg}: ${RPM}"
          curl -fsSL -o "downloads/${RPM}" "${HVLOADER_URL}/${RPM}"
          ls -lh downloads/

      - name: Resolve latest Hyper-V RPM URLs
        run: |
          set -euo pipefail
          # The non-oss feed exposes a simple directory listing. Scrape it
          # for the newest RPM matching each package name.
          NON_OSS_URL=${MS_REPO_BASE_URL}/ms-non-oss/x86_64/Packages/m
          INDEX="$(curl -fsSL "${NON_OSS_URL}/")"
          mkdir -p downloads
          for pkg in $MS_RPMS; do
            CANDIDATES="$(printf '%s\n' "$INDEX" \
              | grep -oE "${pkg}-[0-9][^\"']*\.rpm" \
              | sort -uV)"
            if [ -z "$CANDIDATES" ]; then
              echo "::error::No RPMs found for '${pkg}' at ${NON_OSS_URL}/"
              exit 1
            fi
            RPM="$(printf '%s\n' "$CANDIDATES" | tail -n1)"
            echo "Latest ${pkg}: ${RPM}"
            curl -fsSL -o "downloads/${RPM}" "${NON_OSS_URL}/${RPM}"
          done
          ls -lh downloads/

      - name: Derive package version
        id: version
        run: |
          set -euo pipefail
          # Reuse the upstream hypervisor RPM's version-release so apt picks
          # up new Microsoft drops automatically.
          HV_RPM="$(ls downloads/*.rpm | head -n1)"
          VR="$(rpm -qp --queryformat '%{VERSION}-%{RELEASE}' "$HV_RPM" \
            2>/dev/null || true)"
          if [ -z "$VR" ]; then
            BN="$(basename "$HV_RPM" .rpm)"
            VR="${BN#hypervisor-}"
            VR="${VR%.x86_64}"
          fi
          # Debian rejects characters outside [A-Za-z0-9.+:~-]; normalise.
          DEB_VERSION="$(echo "$VR" | tr -c 'A-Za-z0-9.+:~-' '.')~ms1"
          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Debian version: ${DEB_VERSION}"

      - name: Extract RPM payloads
        run: |
          set -euo pipefail
          mkdir -p stage
          for rpm in downloads/*.rpm; do
            (cd stage && rpm2cpio "../$rpm" | cpio -idm)
          done
          # Sanity: HvLoader.efi must be present, otherwise everything
          # downstream is pointless.
          find stage -name 'HvLoader.efi' -print | head -n1 \
            | grep -q . || { echo "::error::hvloader.efi missing in hypervisor RPM"; exit 1; }

      - name: Build hyperv .deb
        run: |
          set -euo pipefail
          ROOT="build/hyperv"
          mkdir -p "$ROOT/DEBIAN"
          mv stage/* $ROOT/

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: hyperv
          Version: ${{ steps.version.outputs.deb_version }}
          Section: admin
          Priority: optional
          Architecture: amd64
          Maintainer: hyperv-for-linux maintainers <noreply@example.invalid>
          Depends: systemd
          Recommends: linux-image-hyperv
          Description: Microsoft Hypervisor for Linux (repackaged from Azure Linux non-oss)
           Ships the Microsoft Hypervisor loader, supporting payload, and
           firmware blobs, repackaged from packages.microsoft.com/azurelinux/
           3.0/prod/non-oss/. The postinst installs hvloader.efi onto the
           ESP and registers a systemd-boot entry that chainloads it.
          EOF

          mkdir -p out
          dpkg-deb --build --root-owner-group "$ROOT" out/

      - name: List built package
        run: |
          ls -lh out/
          for deb in out/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb" | head -n 20
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperv-${{ steps.version.outputs.deb_version }}
          path: out/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish to apt repository
        uses: ./.github/actions/publish-apt
        with:
          debs_glob: "out/hyperv_*_amd64.deb"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gpg_private_key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          gpg_passphrase: ""
