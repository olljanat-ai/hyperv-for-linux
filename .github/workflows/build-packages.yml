name: Build Hyper-V package

# Builds the 'hyperv' meta-package: a .deb that ships NO Microsoft
# binaries, only the maintainer scripts and a pinned-URL manifest.
# The postinst downloads the Microsoft Hypervisor + firmware RPMs from
# packages.microsoft.com at install time and extracts them onto the
# target machine. That keeps the actual redistribution of the
# closed-source bits on the end-user, where their Microsoft license
# acceptance lives (issue #6).
#
# Run weekly so newly published Microsoft drops are picked up: each
# workflow run re-scrapes the upstream feeds, pins the latest URLs into
# sources.conf, and ships a new .deb whose version mirrors the upstream
# RPM Version-Release so apt upgrade triggers a fresh download.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-packages.yml"
      - "packaging/hyperv/**"
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

concurrency:
  # Serialise all writers to the apt repo (gh-pages) so two simultaneous
  # publishes don't clobber each other.
  group: apt-repo-publish
  cancel-in-progress: false

env:
  MS_REPO_BASE_URL: "https://packages.microsoft.com/azurelinux/3.0/prod"
  # Non-oss RPMs to pin (closed-source Microsoft Hypervisor payload).
  MS_NON_OSS_RPMS: "mshv-bootloader-lx mshv"
  # base/ RPMs to pin (the EFI loader stub).
  MS_BASE_RPMS: "hvloader"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts dpkg-dev fakeroot \
            curl ca-certificates

      - name: Resolve latest upstream RPM URLs
        id: resolve
        run: |
          set -euo pipefail

          mkdir -p urls
          : > urls/sources.conf
          : > urls/hv-rpm-name

          resolve_one() {
            local base="$1"
            local pkg="$2"
            local index candidates rpm
            index="$(curl -fsSL "${base}/")"
            candidates="$(printf '%s\n' "$index" \
              | grep -oE "${pkg}-[0-9][^\"']*\.rpm" \
              | sort -uV)"
            if [ -z "$candidates" ]; then
              echo "::error::No RPMs found for '${pkg}' at ${base}/"
              exit 1
            fi
            rpm="$(printf '%s\n' "$candidates" | tail -n1)"
            echo "Latest ${pkg}: ${rpm}"
            echo "${base}/${rpm}" >> urls/sources.conf
            # The version of the 'mshv' RPM drives the .deb version.
            if [ "$pkg" = "mshv" ]; then
              echo "${rpm}" > urls/hv-rpm-name
            fi
          }

          for pkg in $MS_BASE_RPMS; do
            resolve_one "${MS_REPO_BASE_URL}/base/x86_64/Packages/h" "${pkg}"
          done
          for pkg in $MS_NON_OSS_RPMS; do
            resolve_one "${MS_REPO_BASE_URL}/ms-non-oss/x86_64/Packages/m" "${pkg}"
          done

          echo "=== pinned URLs ==="
          cat urls/sources.conf

      - name: Derive package version
        id: version
        run: |
          set -euo pipefail
          # Mirror the upstream hypervisor RPM's version-release so apt
          # picks up new Microsoft drops automatically. The RPM *name*
          # already carries version-release; no need to download the
          # payload just to read it.
          NAME="$(cat urls/hv-rpm-name)"
          VR="${NAME#mshv-}"
          VR="${VR%.x86_64.rpm}"
          # Debian rejects characters outside [A-Za-z0-9.+:~-]; normalise.
          DEB_VERSION="$(echo "$VR" | tr -c 'A-Za-z0-9.+:~-' '.')~ms1"
          echo "deb_version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Debian version: ${DEB_VERSION}"

      - name: Stage meta-package tree
        run: |
          set -euo pipefail
          ROOT="build/hyperv"
          mkdir -p "$ROOT/DEBIAN" \
                   "$ROOT/usr/lib/hyperv" \
                   "$ROOT/usr/share/doc/hyperv"

          # Scripts that run at install / removal time.
          install -m 0755 packaging/hyperv/scripts/download-binaries.sh "$ROOT/usr/lib/hyperv/"
          install -m 0755 packaging/hyperv/scripts/register-loader.sh   "$ROOT/usr/lib/hyperv/"
          install -m 0755 packaging/hyperv/scripts/unregister-loader.sh "$ROOT/usr/lib/hyperv/"

          # Pinned RPM URLs the postinst downloads. Regenerated on every
          # workflow run, so 'apt upgrade' will fetch fresh Microsoft
          # drops via this manifest.
          install -m 0644 urls/sources.conf "$ROOT/usr/lib/hyperv/sources.conf"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: hyperv
          Version: ${{ steps.version.outputs.deb_version }}
          Section: admin
          Priority: optional
          Architecture: amd64
          Maintainer: hyperv-for-linux maintainers <noreply@example.invalid>
          Depends: systemd, curl, ca-certificates, libarchive-tools
          Recommends: linux-image-hyperv
          Description: Microsoft Hypervisor for Linux (installer meta-package)
           Downloads the Microsoft Hypervisor loader and firmware blobs
           from packages.microsoft.com/azurelinux/3.0/prod/ at install
           time and registers a systemd-boot entry that chainloads
           HvLoader.efi from the ESP.
           .
           The Microsoft binaries are NOT redistributed by this package;
           the postinst fetches them on the target machine, where the
           user accepts Microsoft's license at install time.
          EOF

          install -m 0755 packaging/hyperv/debian/postinst "$ROOT/DEBIAN/postinst"
          install -m 0755 packaging/hyperv/debian/prerm    "$ROOT/DEBIAN/prerm"
          install -m 0755 packaging/hyperv/debian/postrm   "$ROOT/DEBIAN/postrm"

          mkdir -p out
          dpkg-deb --build --root-owner-group "$ROOT" out/

      - name: Verify .deb ships no upstream binaries
        run: |
          set -euo pipefail
          # Belt-and-braces: the whole point of this rework is that no
          # Microsoft binary leaves CI inside our .deb. Fail loudly if
          # something snuck back in.
          for deb in out/*.deb; do
            if dpkg-deb -c "$deb" | grep -E '\.(efi|bin|so)\b'; then
              echo "::error::$deb contains binary artifacts; meta-package must be source-free"
              exit 1
            fi
          done

      - name: List built package
        run: |
          ls -lh out/
          for deb in out/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperv-${{ steps.version.outputs.deb_version }}
          path: out/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish to apt repository
        uses: ./.github/actions/publish-apt
        with:
          debs_glob: "out/hyperv_*_amd64.deb"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gpg_private_key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          gpg_passphrase: ""
